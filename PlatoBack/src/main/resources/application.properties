spring.datasource.url=jdbc:postgresql://localhost:5432/plato
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:plato-development-secret-change-in-production-2026}
app.jwt.expiration-seconds=28800
app.root.username=${ROOT_USERNAME:root}
app.root.password=${ROOT_PASSWORD:change-root-password}
