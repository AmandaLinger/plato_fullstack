<div class="overlay" (click)="closed.emit()">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="supplier-form-title" (click)="$event.stopPropagation()">
    <button class="close-button" type="button" aria-label="Fechar" (click)="closed.emit()">×</button>
    <p class="eyebrow">Parceiros</p>
    <h2 id="supplier-form-title">Adicionar fornecedor</h2>
    <form [formGroup]="form" (ngSubmit)="save()">
      <label for="supplier-name">Nome</label>
      <input id="supplier-name" formControlName="nome" placeholder="Nome da empresa">
      @if (form.controls.nome.touched && form.controls.nome.invalid) { <small>Informe o nome.</small> }
      <label for="supplier-cnpj">CNPJ <span>(opcional)</span></label>
      <input id="supplier-cnpj" formControlName="cnpj" placeholder="00.000.000/0000-00">
      <div class="actions">
        <button class="secondary-button" type="button" (click)="closed.emit()">Cancelar</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid">Salvar</button>
      </div>
    </form>
  </section>
</div>
