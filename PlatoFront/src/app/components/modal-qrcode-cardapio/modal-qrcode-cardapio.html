<div class="overlay" (click)="closed.emit()">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="qrcode-title" (click)="$event.stopPropagation()">
    <button class="close" type="button" aria-label="Fechar" (click)="closed.emit()">×</button>
    <p class="eyebrow">Cardápio digital</p>
    <h2 id="qrcode-title">QR Code do Cardápio</h2>
    <p class="description">Imprima ou compartilhe para que seus clientes acessem o cardápio.</p>

    <div class="qr-frame"><canvas #qrCanvas aria-label="QR Code do cardápio"></canvas></div>

    <label for="menu-url">Link público</label>
    <div class="link-row">
      <input id="menu-url" type="text" readonly [value]="cardapioUrl">
      <button type="button" (click)="copyLink()">{{ copied ? 'Copiado!' : 'Copiar link' }}</button>
    </div>
    @if (errorMessage) { <p class="error" role="alert">{{ errorMessage }}</p> }
    <button class="download" type="button" [disabled]="!!errorMessage" (click)="download()">Baixar QR Code (.png)</button>
  </section>
</div>
