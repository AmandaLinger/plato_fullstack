<main>

  <div class="logo-escrita">
    plato
  </div>

  <form class="container" [formGroup]="form" (ngSubmit)="submit()">
    <div class="img-container">
      <img src="/logo_plato.svg" alt="ícone de login">
    </div>

    <div class="inputs">
      <div class="flex-column mb-8px">
        <label for="usuario" class="mb-4px">Usuario</label>
        <input id="usuario" formControlName="nome" autocomplete="username" placeholder="usuario" />
      </div>

      <div class="flex-column mb-8px">
        <label for="senha" class="mb-4px">Senha</label>
        <input id="senha" formControlName="senha" type="password" autocomplete="current-password" placeholder="********" />
      </div>
    </div>

    @if (errorMessage) {
      <p class="login-error" role="alert">{{ errorMessage }}</p>
    }

    <div class="container-btn">
      <app-btn-orange type="submit">
        {{ isLoading ? 'Entrando...' : 'Login' }}
      </app-btn-orange>
    </div>
    <a routerLink="/cadastrar-restaurante" class="link-cadastro">
      Cadastrar restaurante</a>
  </form>

  <app-footer-component/>
</main>
